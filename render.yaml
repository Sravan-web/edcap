# Render Blueprint — 1-Click Cloud Deployment for EdCap (FastAPI Backend + Next.js Frontend)
services:
  - type: web
    name: edcap-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: development
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./edcap.db
      - key: JWT_SECRET_KEY
        generateValue: true

  - type: web
    name: edcap-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        fromService:
          type: web
          name: edcap-backend
          envVarKey: RENDER_EXTERNAL_URL
